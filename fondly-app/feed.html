<script>
(function(){
  const API_BASE_URL = 'http://localhost:3000';

  const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function requireLogin() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'index.html';
    }
    return data.session;
  }
  window.requireLogin = requireLogin;

  let currentUserId = null;

  const toast = document.getElementById('toastNotification');
  const toastMessage = document.getElementById('toastMessage');
  const toastIcon = document.getElementById('toastIcon');
  const toastActionBtn = document.getElementById('toastActionBtn');
  let toastTimer = null;

  function showToast(msg, icon = 'check_circle', showUndo = false, onUndo = null) {
    if (toastTimer) clearTimeout(toastTimer);
    toastMessage.textContent = msg;
    toastIcon.textContent = icon;
    if (showUndo && onUndo) {
      toastActionBtn.classList.remove('hidden');
      toastActionBtn.onclick = () => {
        onUndo();
        toast.classList.add('hidden');
      };
    } else {
      toastActionBtn.classList.add('hidden');
    }
    toast.classList.remove('hidden');
    toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
    }, 4000);
  }

  // ---------------- Stories ----------------
  let groupedStories = {};
  let currentStoryGroup = null;
  let currentStoryIndex = 0;

    function firstNameOf(profile) {
    if (!profile) return 'Someone';
    if (profile.first_name) return profile.first_name;
    if (profile.display_name) return profile.display_name.split(' ')[0];
    return profile.email ? profile.email.split('@')[0] : 'Someone';
  }

  async function loadStories() {
    const session = await requireLogin();
    if (!session) return;
    currentUserId = session.user.id;
    try {
      const res = await fetch(`${API_BASE_URL}/stories`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load stories');
      const allStories = await res.json();

      groupedStories = {};
      allStories.forEach(s => {
        if (!groupedStories[s.user_id]) {
          groupedStories[s.user_id] = { userId: s.user_id, profile: s.profiles, stories: [] };
        }
        groupedStories[s.user_id].stories.push(s);
      });
      Object.values(groupedStories).forEach(g => {
        g.stories.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      });

      renderStoriesRow();
    } catch (err) {
      console.warn('Could not load stories:', err.message);
    }
  }

  function buildStoryTile(story, label) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.style.cssText = 'position:relative;flex-shrink:0;width:76px;height:120px;border-radius:14px;overflow:hidden;background:#e2e3e1;';
    const isImage = story.media_type && story.media_type.startsWith('image/');
    tile.innerHTML = `
      ${isImage
        ? `<img alt="${label}" class="story-thumb-img" data-path="${story.media_url}" style="width:100%;height:100%;object-fit:cover;display:block;"/>`
        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1c1b;"><span class="material-symbols-outlined" style="font-size:32px;color:#ffffff;">play_circle</span></div>`
      }
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.65) 100%);"></div>
           <div style="position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:2.5px solid #059669;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${story.profiles && story.profiles.avatar_url
          ? `<img src="${story.profiles.avatar_url}" style="width:100%;height:100%;object-fit:cover;"/>`
          : `<span class="material-symbols-outlined" style="font-size:14px;color:#76777d;">person</span>`
        }
      </div>
      <span style="position:absolute;bottom:6px;left:6px;right:6px;font-size:10px;font-weight:700;color:#ffffff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
    `;
    tile.addEventListener('click', () => openStoryViewer(story.user_id));
    return tile;
  }

  function renderStoriesRow() {
    const row = document.getElementById('storiesRow');
    row.innerHTML = '';

    const myGroup = groupedStories[currentUserId];

    const createTile = document.createElement('button');
    createTile.type = 'button';
    createTile.style.cssText = 'position:relative;flex-shrink:0;width:76px;height:120px;border-radius:14px;overflow:hidden;background:#f4f4f2;border:1px solid #e2e3e1;';
       const myAvatarUrl = (groupedStories[currentUserId] && groupedStories[currentUserId].profile) ? groupedStories[currentUserId].profile.avatar_url : ownAvatarUrl;
    createTile.innerHTML = `

        }
      </div>
      <div style="height:30%;position:relative;">
        <span style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#059669;border:3px solid #ffffff;display:flex;align-items:center;justify-content:center;color:#ffffff;">

      </div>
      <span style="position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#1a1c1b;">Create Story</span>
    `;
    createTile.addEventListener('click', () => document.getElementById('storyMediaInput').click());
    row.appendChild(createTile);

    if (myGroup) {
      const latest = myGroup.stories[myGroup.stories.length - 1];
      row.appendChild(buildStoryTile(latest, 'Your story'));
    }

    Object.values(groupedStories)
      .filter(g => g.userId !== currentUserId)
      .sort((a, b) => new Date(b.stories[b.stories.length - 1].created_at) - new Date(a.stories[a.stories.length - 1].created_at))
      .forEach(g => {
        const latest = g.stories[g.stories.length - 1];
             const name = firstNameOf(g.profile);
        row.appendChild(buildStoryTile(latest, name));

    row.querySelectorAll('.story-thumb-img').forEach(img => {
      getSignedPostMediaUrl(img.dataset.path).then(url => { if (url) img.src = url; });
    });
  }

    modal.classList.remove('hidden');
    modal.classList.add('flex');

    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.getElementById('storyViewerMedia').innerHTML = '';
    currentStoryGroup = null;
  }

  function renderCurrentStory() {
    if (!currentStoryGroup) return;
    const story = currentStoryGroup.stories[currentStoryIndex];
    const name = currentStoryGroup.profile ? (currentStoryGroup.profile.display_name || currentStoryGroup.profile.email) : 'User';

    document.getElementById('storyViewerName').textContent = name;
    document.getElementById('storyViewerTime').textContent = formatRelativeTime(story.created_at);

    const mediaContainer = document.getElementById('storyViewerMedia');
    mediaContainer.innerHTML = '';
    const isImage = story.media_type && story.media_type.startsWith('image/');
    if (isImage) {
      const img = document.createElement('img');
      img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;';
      mediaContainer.appendChild(img);
      getSignedPostMediaUrl(story.media_url).then(url => { if (url) img.src = url; });
    } else {
      const video = document.createElement('video');
      video.style.cssText = 'max-width:100%;max-height:100%;';
      video.controls = true;
      video.autoplay = true;
      mediaContainer.appendChild(video);
      getSignedPostMediaUrl(story.media_url).then(url => { if (url) video.src = url; });
    }

    const deleteBtn = document.getElementById('storyViewerDeleteBtn');
    deleteBtn.classList.toggle('hidden', story.user_id !== currentUserId);

    document.getElementById('storyViewerPrevBtn').style.visibility = currentStoryIndex === 0 ? 'hidden' : 'visible';
    document.getElementById('storyViewerNextBtn').style.visibility = 'visible';
  }

  async function deleteCurrentStory() {
    if (!currentStoryGroup) return;
    const story = currentStoryGroup.stories[currentStoryIndex];
    if (!confirm('Delete this story?')) return;
    const session = await requireLogin();
    if (!session) return;
    try {
      await fetch(`${API_BASE_URL}/stories/${story.id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      closeStoryViewer();
      await loadStories();
    } catch (err) {
      alert('Could not delete story');
    }
  }

  async function uploadAndCreateStory(file) {
    const session = await requireLogin();
    if (!session) return;
    showToast('Uploading story...');
    try {
      const urlRes = await fetch(`${API_BASE_URL}/posts/media/upload-url`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ file_name: file.name })
      });
      if (!urlRes.ok) throw new Error('Could not get upload URL');
      const { path, token } = await urlRes.json();

      const { error: uploadError } = await supabaseClient
        .storage
        .from('posts-media')
        .uploadToSignedUrl(path, token, file);
      if (uploadError) throw new Error(uploadError.message);

      const res = await fetch(`${API_BASE_URL}/stories`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ media_url: path, media_type: file.type })
      });
      if (!res.ok) throw new Error('Could not create story');

      await loadStories();
      showToast('Story posted!');
    } catch (err) {
      alert('Could not post story: ' + err.message);
    }
  }

  // ---------------- Community Posts ----------------
   let postDraftFile = null;
  let ownAvatarUrl = null;
  const postSignedUrlCache = {};

  function formatRelativeTime(isoDate) {
    const diffMs = Date.now() - new Date(isoDate).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  async function getSignedPostMediaUrl(path) {
    if (postSignedUrlCache[path]) return postSignedUrlCache[path];
    const session = await requireLogin();
    if (!session) return null;
    try {
      const res = await fetch(`${API_BASE_URL}/posts/media/signed-url?path=${encodeURIComponent(path)}`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      postSignedUrlCache[path] = data.signedUrl;
      return data.signedUrl;
    } catch (err) {
      return null;
    }
  }

  async function loadOwnAvatar() {
    const session = await requireLogin();
    if (!session) return;
    try {
      const res = await fetch(`${API_BASE_URL}/profile/avatar`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) return;
      const data = await res.json();
          if (data.avatar_url) {
        ownAvatarUrl = data.avatar_url;
        const container = document.getElementById('composerAvatarContainer');
        if (container) {
          container.innerHTML = `<img src="${data.avatar_url}" style="width:100%;height:100%;object-fit:cover;"/>`;
        }
      }
    } catch (err) {
      // keep default icon
    }
  }

  async function loadPosts() {
    const session = await requireLogin();
    if (!session) return;
    currentUserId = session.user.id;
    try {
      const res = await fetch(`${API_BASE_URL}/posts`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load posts');
      const posts = await res.json();
      renderPostsFeed(posts);
    } catch (err) {
      console.warn('Could not load posts:', err.message);
    }
  }

  function renderPostsFeed(posts) {
    const section = document.getElementById('postsFeedSection');
    section.innerHTML = '';
    if (posts.length === 0) {
      section.innerHTML = '<p style="font-size:13px;color:#45464d;text-align:center;padding:16px;">No posts yet. Be the first to share something!</p>';
      return;
    }

    posts.forEach(post => {
           const authorName = firstNameOf(post.profiles);
      const timeAgo = formatRelativeTime(post.created_at);
      const isMine = post.user_id === currentUserId;

      let mediaHtml = '';
      if (post.media_url) {
        if (post.media_type && post.media_type.startsWith('image/')) {
          mediaHtml = `<img alt="Post media" class="post-media-img w-full rounded-xl" data-path="${post.media_url}" style="max-height:400px;object-fit:cover;background:#e2e3e1;min-height:120px;display:block;"/>`;
        } else if (post.media_type && post.media_type.startsWith('video/')) {
          mediaHtml = `<video class="post-media-video w-full rounded-xl" controls style="max-height:400px;background:#000;" data-path="${post.media_url}"></video>`;
        } else if (post.media_type && post.media_type.startsWith('audio/')) {
          mediaHtml = `<audio class="post-media-audio w-full" controls data-path="${post.media_url}"></audio>`;
        } else {
          const fileName = post.media_url.split('/').pop();
          mediaHtml = `
            <div style="display:flex;align-items:center;gap:8px;padding:12px;background:#f4f4f2;border-radius:12px;">
              <span class="material-symbols-outlined">description</span>
              <span style="font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${fileName}</span>
              <a class="post-download-link" data-path="${post.media_url}" href="#" style="font-size:12px;font-weight:700;color:#059669;text-decoration:underline;">Download</a>
            </div>
          `;
        }
      }

      const card = document.createElement('div');
      card.className = 'bg-surface-container-lowest rounded-2xl p-4 border border-outline-variant/30 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.04)] flex flex-col gap-3';
           const authorAvatar = post.profiles ? post.profiles.avatar_url : null;
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;">
            ${authorAvatar
              ? `<img src="${authorAvatar}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;"/>`
              : `<div style="width:38px;height:38px;border-radius:50%;background:#eeeeec;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span class="material-symbols-outlined" style="color:#76777d;">person</span></div>`
            }
            <div>
              <div style="font-weight:700;font-size:13px;color:#1a1c1b;">${authorName}</div>
              <div style="font-size:11px;color:#76777d;">${timeAgo}</div>
            </div>
          </div>
          ${isMine ? `<button class="delete-post-btn" data-id="${post.id}" style="color:#76777d;background:none;border:none;cursor:pointer;display:flex;"><span class="material-symbols-outlined" style="font-size:20px;">more_horiz</span></button>` : ''}
        </div>
        ${post.caption ? `<p style="font-size:14px;color:#1a1c1b;white-space:pre-wrap;line-height:1.4;">${post.caption}</p>` : ''}
        ${mediaHtml}
      `;
      section.appendChild(card);
    });

    section.querySelectorAll('.delete-post-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this post?')) return;
        const id = btn.getAttribute('data-id');
        const session = await requireLogin();
        if (!session) return;
        try {
          await fetch(`${API_BASE_URL}/posts/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${session.access_token}` }
          });
          await loadPosts();
        } catch (err) {
          alert('Could not delete post');
        }
      });
    });

    section.querySelectorAll('.post-media-img').forEach(img => {
      getSignedPostMediaUrl(img.dataset.path).then(url => { if (url) img.src = url; });
    });
    section.querySelectorAll('.post-media-video').forEach(video => {
      getSignedPostMediaUrl(video.dataset.path).then(url => { if (url) video.src = url; });
    });
    section.querySelectorAll('.post-media-audio').forEach(audio => {
      getSignedPostMediaUrl(audio.dataset.path).then(url => { if (url) audio.src = url; });
    });
    section.querySelectorAll('.post-download-link').forEach(link => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const url = await getSignedPostMediaUrl(link.dataset.path);
        if (url) window.open(url, '_blank');
      });
    });
  }

  function openCreatePostModal() {
    document.getElementById('createPostModal').classList.remove('hidden');
  }

  async function submitNewPost() {
    const caption = document.getElementById('postCaptionInput').value.trim();
    const file = postDraftFile;
    if (!caption && !file) {
      alert('Write something or attach media first.');
      return;
    }
    const session = await requireLogin();
    if (!session) return;

    try {
      let media_url = null;
      let media_type = null;

      if (file) {
        const urlRes = await fetch(`${API_BASE_URL}/posts/media/upload-url`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ file_name: file.name })
        });
        if (!urlRes.ok) throw new Error('Could not get upload URL');
        const { path, token } = await urlRes.json();

        const { error: uploadError } = await supabaseClient
          .storage
          .from('posts-media')
          .uploadToSignedUrl(path, token, file);
        if (uploadError) throw new Error(uploadError.message);

              media_url = path;
        media_type = file.type;
      }

      const postRes = await fetch(`${API_BASE_URL}/posts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ caption: caption || null, media_url, media_type })
      });
      if (!postRes.ok) {
        const errBody = await postRes.json().catch(() => ({}));
        throw new Error(errBody.error || `Server returned ${postRes.status}`);
      }

      document.getElementById('postCaptionInput').value = '';
      document.getElementById('postMediaLabel').classList.add('hidden');
      postDraftFile = null;
      document.getElementById('createPostModal').classList.add('hidden');
      await loadPosts();
      showToast('Posted!');
    } catch (err) {
      alert('Could not create post: ' + err.message);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const openPostComposerBtn = document.getElementById('openPostComposerBtn');
    const postPhotoShortcutBtn = document.getElementById('postPhotoShortcutBtn');
    const postAudioShortcutBtn = document.getElementById('postAudioShortcutBtn');
    const postFileShortcutBtn = document.getElementById('postFileShortcutBtn');
    const closeCreatePostModalBtn = document.getElementById('closeCreatePostModalBtn');
    const postMediaPickBtn = document.getElementById('postMediaPickBtn');
    const postMediaInput = document.getElementById('postMediaInput');
    const submitPostBtn = document.getElementById('submitPostBtn');

    if (openPostComposerBtn) openPostComposerBtn.addEventListener('click', openCreatePostModal);
    if (postPhotoShortcutBtn) {
      postPhotoShortcutBtn.addEventListener('click', () => {
        openCreatePostModal();
        postMediaInput.click();
      });
    }
    if (postAudioShortcutBtn) {
      postAudioShortcutBtn.addEventListener('click', () => {
        openCreatePostModal();
        postMediaInput.click();
      });
    }
    if (postFileShortcutBtn) {
      postFileShortcutBtn.addEventListener('click', () => {
        openCreatePostModal();
        postMediaInput.click();
      });
    }
    if (closeCreatePostModalBtn) {
      closeCreatePostModalBtn.addEventListener('click', () => {
        document.getElementById('createPostModal').classList.add('hidden');
      });
    }
    if (postMediaPickBtn) {
      postMediaPickBtn.addEventListener('click', () => postMediaInput.click());
    }
    if (postMediaInput) {
      postMediaInput.addEventListener('change', () => {
        const file = postMediaInput.files[0];
        if (file) {
          postDraftFile = file;
          const label = document.getElementById('postMediaLabel');
          label.textContent = `Attached: ${file.name}`;
          label.classList.remove('hidden');
        }
      });
    }
    if (submitPostBtn) submitPostBtn.addEventListener('click', submitNewPost);

    const closeStoryViewerBtn = document.getElementById('closeStoryViewerBtn');
    const storyViewerPrevBtn = document.getElementById('storyViewerPrevBtn');
    const storyViewerNextBtn = document.getElementById('storyViewerNextBtn');
    const storyViewerDeleteBtn = document.getElementById('storyViewerDeleteBtn');
    const storyMediaInput = document.getElementById('storyMediaInput');

    if (closeStoryViewerBtn) closeStoryViewerBtn.addEventListener('click', closeStoryViewer);
    if (storyViewerPrevBtn) {
      storyViewerPrevBtn.addEventListener('click', () => {
        if (currentStoryIndex > 0) {
          currentStoryIndex--;
          renderCurrentStory();
        }
      });
    }
    if (storyViewerNextBtn) {
      storyViewerNextBtn.addEventListener('click', () => {
        if (currentStoryGroup && currentStoryIndex < currentStoryGroup.stories.length - 1) {
          currentStoryIndex++;
          renderCurrentStory();
        } else {
          closeStoryViewer();
        }
      });
    }
    if (storyViewerDeleteBtn) storyViewerDeleteBtn.addEventListener('click', deleteCurrentStory);
    if (storyMediaInput) {
      storyMediaInput.addEventListener('change', async () => {
        const file = storyMediaInput.files[0];
        storyMediaInput.value = '';
        if (file) await uploadAndCreateStory(file);
      });
    }

       loadOwnAvatar().then(() => {
      loadPosts();
      loadStories();
    });
  });
})();
</script>
<script>
(function(){
  var routes = {"Home": "home.html", "Breakdown": "breakdown.html", "Plan": "plan.html", "Activity": "log-outflow.html", "Feeds": "feed.html"};
  document.querySelectorAll("[data-tab]").forEach(function(el){
    var dest = routes[el.getAttribute("data-tab")];
    if(!dest) return;
    if (el.getAttribute("data-tab") === "Feeds") return;
    el.addEventListener("click", function(e){
      e.preventDefault();
      window.location.href = dest;
    });
  });
})();
</script>
</body></html>

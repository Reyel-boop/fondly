<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Fill these in with your real Supabase Project URL and anon/publishable key
    // (Supabase → Project Settings → API Keys). This key is safe to use in frontend code.
    const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
<script>
    const toggleSignupPassword = document.getElementById('toggleSignupPassword');
    const signupPasswordField = document.getElementById('signupPassword');
    const signupEyeIcon = document.getElementById('signupEyeIcon');

    if (toggleSignupPassword && signupPasswordField && signupEyeIcon) {
      toggleSignupPassword.addEventListener('click', () => {
        const isPassword = signupPasswordField.getAttribute('type') === 'password';
        signupPasswordField.setAttribute('type', isPassword ? 'text' : 'password');
        signupEyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

     const API_BASE_URL = '';  // same-origin: works both locally and when deployed

    const signupForm = document.getElementById('signupForm');
    const confirmPasswordField = document.getElementById('confirmPassword');
    const mismatchNote = document.getElementById('passwordMismatchNote');
    const errorNote = document.getElementById('signupErrorNote');
  const fullNameField = document.getElementById('fullName');
const identifierField = document.getElementById('signupIdentifier');

    if (signupForm) {
      signupForm.addEventListener('submit', async () => {
        mismatchNote.classList.add('hidden');
        errorNote.classList.add('hidden');

        if (signupPasswordField.value !== confirmPasswordField.value) {
          mismatchNote.classList.remove('hidden');
          confirmPasswordField.focus();
          return;
        }

       const fullNameParts = fullNameField.value.trim().split(/\s+/);
const firstName = fullNameParts[0] || '';
const lastName = fullNameParts.slice(1).join(' ') || '';

        const submitBtn = signupForm.querySelector('button[type="submit"]');
        if (submitBtn) submitBtn.disabled = true;

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: identifierField.value.trim(),
            password: signupPasswordField.value,
            options: {
              data: {
                full_name: lastName ? `${firstName} ${lastName}` : firstName,
                first_name: firstName,
                last_name: lastName || null
              }
            }
          });

          if (error) throw error;

          if (data.session) {
            try {
              await fetch(`${API_BASE_URL}/profile/name`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${data.session.access_token}`
                },
                body: JSON.stringify({ first_name: firstName, last_name: lastName || null })
              });
            } catch (nameErr) {
              // account is created either way; name can still be filled in later if this fails
            }
          }

          window.location.href = 'home.html';
        } catch (err) {
          errorNote.textContent = err.message || 'Could not create account. Please try again.';
          errorNote.classList.remove('hidden');
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });
    }

    const signupBiometricBtn = document.getElementById('signupBiometricBtn');
    if (signupBiometricBtn) {
      signupBiometricBtn.addEventListener('click', () => {
        window.location.href = 'home.html';
      });
    }
  </script>

<script>
    // Same Project URL and anon/publishable key used in signup.html
    const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto login: if a session is already saved on this device (from a
    // previous sign-in), skip straight to the app instead of asking the
    // person to log in again.
    (async () => {
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
          window.location.replace('home.html');
          return;
        }
      } catch (err) {
        console.warn('Could not check existing session:', err.message);
      }
      const mainEl = document.getElementById('signInMain');
      if (mainEl) mainEl.style.visibility = 'visible';
    })();
  </script>
<script>
    // Lightweight micro-interaction for password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePassword && passwordField && eyeIcon) {
      togglePassword.addEventListener('click', () => {
        const isPassword = passwordField.getAttribute('type') === 'password';
        passwordField.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Real auth: sign in with Supabase
    const loginForm = document.getElementById('loginForm');
    const identifierField = document.getElementById('identifier');
    const loginErrorNote = document.getElementById('loginErrorNote');

    if (loginForm) {
      loginForm.addEventListener('submit', async () => {
        loginErrorNote.classList.add('hidden');
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        if (submitBtn) submitBtn.disabled = true;

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: identifierField.value.trim(),
            password: passwordField.value
          });

          if (error) throw error;

          window.location.href = 'home.html';
        } catch (err) {
          loginErrorNote.textContent = err.message || 'Could not sign in. Please try again.';
          loginErrorNote.classList.remove('hidden');
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });
    }
    const biometricBtn = document.querySelector('button[type="button"]');
    if (biometricBtn && biometricBtn.textContent.includes('Biometric')) {
      biometricBtn.addEventListener('click', async () => {
        loginErrorNote.classList.add('hidden');

        const email = identifierField.value.trim();
        if (!email) {
          loginErrorNote.textContent = 'Enter your email above first, then tap Biometric Passkey.';
          loginErrorNote.classList.remove('hidden');
          identifierField.focus();
          return;
        }

        if (!window.SimpleWebAuthnBrowser || !window.SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
          loginErrorNote.textContent = 'This device or browser doesn\'t support biometric passkeys.';
          loginErrorNote.classList.remove('hidden');
          return;
        }

        biometricBtn.disabled = true;
        try {
          const optsRes = await fetch('/webauthn/authentication-options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const opts = await optsRes.json();
          if (!optsRes.ok) throw new Error(opts.error || 'No passkey found for this account.');

          const authResponse = await window.SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: opts });

          const verifyRes = await fetch('/webauthn/authentication-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, response: authResponse })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok || !verifyData.success) throw new Error(verifyData.error || 'Passkey verification failed.');

          const { error: sessionError } = await supabaseClient.auth.verifyOtp({
            token_hash: verifyData.token_hash,
            type: 'magiclink'
          });
          if (sessionError) throw sessionError;

          window.location.href = 'home.html';
        } catch (err) {
          if (err && err.name === 'NotAllowedError') {
            loginErrorNote.textContent = 'Biometric login was cancelled.';
          } else {
            loginErrorNote.textContent = (err && err.message) || 'Could not sign in with biometric passkey.';
          }
          loginErrorNote.classList.remove('hidden');
        } finally {
          biometricBtn.disabled = false;
        }
      });
    }
  </script>

<script>
(function(){
  const API_BASE_URL = 'http://localhost:3000';

  const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function requireLogin() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'index.html';
    }
    return data.session;
  }

  const BADGE_ICONS = {
    'first_spark': '✨', 'second_step': '👣', 'pocket_ember': '🔥', 'week_keeper': '🗓️',
    'fortnight_flame': '🔥', 'month_blaze': '🎖️', 'season_bonfire': '🏆', 'century_wildfire': '💎'
  };

  async function loadStreak() {
    const session = await requireLogin();
    if (!session) return;
    try {
      const res = await fetch(`${API_BASE_URL}/streak`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load streak');
      const data = await res.json();

      document.getElementById('currentStreakDisplay').textContent = data.current_streak;
      document.getElementById('longestStreakDisplay').textContent = `Longest streak: ${data.longest_streak} day${data.longest_streak === 1 ? '' : 's'}`;

      const earnedSet = new Set(data.badges);
      const allBadges = data.all_badges;

      const nextBadge = allBadges.find(b => !earnedSet.has(b.id));
      const nextNameEl = document.getElementById('nextBadgeName');
      const nextRemainingEl = document.getElementById('nextBadgeRemaining');
      const nextProgressEl = document.getElementById('nextBadgeProgress');

      if (nextBadge) {
        nextNameEl.textContent = nextBadge.name;
        const remaining = Math.max(0, nextBadge.days - data.current_streak);
        nextRemainingEl.textContent = `${remaining} day${remaining === 1 ? '' : 's'} to go`;
        nextProgressEl.style.width = `${Math.min(100, Math.round((data.current_streak / nextBadge.days) * 100))}%`;
      } else {
        nextNameEl.textContent = 'All badges earned!';
        nextRemainingEl.textContent = '';
        nextProgressEl.style.width = '100%';
      }

      const grid = document.getElementById('badgeGrid');
      grid.innerHTML = '';
      allBadges.forEach(badge => {
        const isEarned = earnedSet.has(badge.id);
        const card = document.createElement('div');
        card.className = `rounded-2xl p-3 flex flex-col items-center gap-1.5 border shadow-sm text-center ${isEarned ? 'bg-secondary-container/30 border-secondary/30' : 'bg-surface-container-lowest border-outline-variant/30 opacity-50'}`;
        card.innerHTML = `
          <span class="text-2xl leading-none">${isEarned ? BADGE_ICONS[badge.id] || '🏅' : '🔒'}</span>
          <span class="font-label-sm text-label-sm font-bold text-on-surface text-center leading-tight">${badge.name}</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant">${badge.days}d</span>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      console.warn('Could not load streak:', err.message);
    }
  }

  document.addEventListener('DOMContentLoaded', loadStreak);
})();
</script>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bubble-mine, .bubble-theirs {
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      max-width: 82%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bubble-mine {
      align-self: flex-end;
      background: #006c4a;
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
    }
    .bubble-theirs {
      align-self: flex-start;
      background: #eeeeec;
      color: #1a1c1b;
      border-radius: 18px 18px 18px 4px;
    }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #76777d;
      display: inline-block; animation: typingDot 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>
<body class="bg-background text-on-surface antialiased h-screen select-none relative overflow-hidden flex flex-col">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<header class="bg-primary shadow-sm shrink-0">
<div class="flex justify-between items-center w-full px-4 h-16 max-w-lg mx-auto">
<div class="flex items-center gap-2">
<a class="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-on-primary transition-colors" href="home.html">
<span class="material-symbols-outlined text-lg">arrow_back</span>
</a>
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]">smart_toy</span>
</span>
<span class="font-headline-md text-headline-md font-bold text-on-primary tracking-tight">Assistant</span>
</div>
</div>
</div>
</header>

<main class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3 max-w-lg mx-auto w-full" id="chatContainer">
<div class="bubble-theirs">Hi! I'm your Fondly assistant. Ask me about your spending, or tell me things like "I spent 150 on lunch" and I'll log it for you. You can also scan a receipt with the camera button below.</div>
</main>

<div class="shrink-0 border-t border-outline-variant/20 bg-surface px-4 py-3 max-w-lg mx-auto w-full">
<div class="flex items-center gap-2">
<button class="w-11 h-11 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface shrink-0 transition-all active:scale-95" id="scanReceiptBtn" title="Scan a receipt" type="button">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<input accept="image/*" capture="environment" class="hidden" id="receiptFileInput" type="file"/>
<input class="flex-1 px-4 py-2.5 bg-surface-container-low rounded-full border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-secondary" id="chatInput" placeholder="Ask or log an expense..." type="text"/>
<button class="w-11 h-11 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0 transition-all active:scale-95" id="sendChatBtn" type="button">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>

<script>
(function(){
  const API_BASE_URL = 'http://localhost:3000';

  const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function requireLogin() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'index.html';
    }
    return data.session;
  }

  function formatPHP(amount) {
    return '₱' + Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const chatContainer = document.getElementById('chatContainer');
  let conversationHistory = [];

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function appendBubble(text, mine) {
    const bubble = document.createElement('div');
    bubble.className = mine ? 'bubble-mine' : 'bubble-theirs';
    bubble.textContent = text;
    chatContainer.appendChild(bubble);
    scrollToBottom();
    return bubble;
  }

  function appendTypingIndicator() {
    const bubble = document.createElement('div');
    bubble.className = 'bubble-theirs';
    bubble.id = 'typingIndicator';
    bubble.innerHTML = '<span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span>';
    chatContainer.appendChild(bubble);
    scrollToBottom();
    return bubble;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    appendBubble(message, true);

    const session = await requireLogin();
    if (!session) return;

    const typingBubble = appendTypingIndicator();

    try {
      const res = await fetch(`${API_BASE_URL}/assistant/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ message, history: conversationHistory })
      });
      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) throw new Error(data.error || 'Could not reach the assistant');

      appendBubble(data.reply, false);
      conversationHistory = data.history || conversationHistory;

      if (data.logged) {
        appendBubble(`✅ Logged ${formatPHP(data.transaction.amount)} - ${data.transaction.category}`, false);
      }
    } catch (err) {
      removeTypingIndicator();
      appendBubble('⚠️ ' + err.message, false);
    }
  }

  function appendReceiptConfirmCard(extracted, imageBase64, mediaType) {
    const card = document.createElement('div');
    card.className = 'bubble-theirs';
    card.style.cssText = 'display:flex;flex-direction:column;gap:8px;width:82%;max-width:82%;';
    card.innerHTML = `
      <div style="font-weight:700;font-size:13px;">Receipt scanned</div>
      <div style="display:flex;flex-direction:column;gap:4px;font-size:13px;">
        <label style="font-size:11px;color:#76777d;">Merchant</label>
        <input class="receipt-merchant" style="padding:6px 10px;border-radius:8px;border:1px solid #c6c6cd;font-size:13px;" type="text" value="${(extracted.merchant || '').replace(/"/g, '&quot;')}"/>
        <label style="font-size:11px;color:#76777d;">Amount (PHP)</label>
        <input class="receipt-amount" style="padding:6px 10px;border-radius:8px;border:1px solid #c6c6cd;font-size:13px;" min="0" step="0.01" type="number" value="${extracted.amount || 0}"/>
        <label style="font-size:11px;color:#76777d;">Category</label>
        <select class="receipt-category" style="padding:6px 10px;border-radius:8px;border:1px solid #c6c6cd;font-size:13px;">
          ${['Food','Groceries','Transport','Coffee','Bills','Shopping','Health','Entertainment','Other'].map(c => `<option value="${c}" ${c === extracted.category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="confirm-receipt-btn" style="flex:1;background:#006c4a;color:#fff;border:none;border-radius:999px;padding:8px;font-weight:700;font-size:13px;cursor:pointer;">Log it</button>
        <button class="discard-receipt-btn" style="background:#e8e8e6;color:#45464d;border:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;">Discard</button>
      </div>
    `;
    chatContainer.appendChild(card);
    scrollToBottom();

    card.querySelector('.discard-receipt-btn').addEventListener('click', () => {
      card.remove();
      appendBubble('Discarded.', false);
    });

    card.querySelector('.confirm-receipt-btn').addEventListener('click', async () => {
      const merchant = card.querySelector('.receipt-merchant').value.trim();
      const amount = parseFloat(card.querySelector('.receipt-amount').value) || 0;
      const category = card.querySelector('.receipt-category').value;

      if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }

      const session = await requireLogin();
      if (!session) return;

      try {
        const res = await fetch(`${API_BASE_URL}/transactions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ type: 'outflow', amount, category, note: merchant || null })
        });
        if (!res.ok) throw new Error('Could not log expense');

        card.remove();
        appendBubble(`✅ Logged ${formatPHP(amount)} at ${merchant || category}`, false);
      } catch (err) {
        alert('Could not log expense: ' + err.message);
      }
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        const base64 = result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function scanReceipt(file) {
    const session = await requireLogin();
    if (!session) return;

    appendBubble('📷 Receipt photo', true);
    const typingBubble = appendTypingIndicator();

    try {
      const base64 = await fileToBase64(file);
      const res = await fetch(`${API_BASE_URL}/assistant/scan-receipt`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ image_base64: base64, media_type: file.type })
      });
      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) throw new Error(data.error || 'Could not scan the receipt');

      appendReceiptConfirmCard(data);
    } catch (err) {
      removeTypingIndicator();
      appendBubble('⚠️ ' + err.message, false);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    requireLogin();

    document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    const fileInput = document.getElementById('receiptFileInput');
    document.getElementById('scanReceiptBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) {
        scanReceipt(fileInput.files[0]);
        fileInput.value = '';
      }
    });
  });
})();
</script>
<script>if ('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('service-worker.js').catch(() => {});});}</script></body></html>

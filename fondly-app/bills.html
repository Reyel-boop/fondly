<script>
(function(){
  const API_BASE_URL = '';  // same-origin: works both locally and when deployed

  const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function requireLogin() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'index.html';
    }
    return data.session;
  }

  function formatPHP(amount) {
    return '₱' + Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const toast = document.getElementById('toastNotification');
  const toastMessage = document.getElementById('toastMessage');
  const toastIcon = document.getElementById('toastIcon');
  let toastTimer = null;
  function showToast(msg, icon = 'check_circle') {
    if (toastTimer) clearTimeout(toastTimer);
    toastMessage.textContent = msg;
    toastIcon.textContent = icon;
    toast.classList.remove('hidden');
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 4000);
  }

  const CATEGORY_ICON_MAP = {
    'Bills': 'bolt',
    'Subscription': 'subscriptions',
    'Loan': 'account_balance',
    'Groceries': 'local_grocery_store',
    'Dining': 'coffee',
    'Transport': 'commute',
    'Shopping': 'shopping_bag',
    'Health': 'health_and_safety'
  };

  async function loadPaydaySettings() {
    const session = await requireLogin();
    if (!session) return;
    try {
      const res = await fetch(`${API_BASE_URL}/payday-settings`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load payday settings');
      const settings = await res.json();

      const daysDisplay = document.getElementById('paydayDaysDisplay');
      const dateDisplay = document.getElementById('paydayDateDisplay');

      if (settings.payday_day) {
        daysDisplay.textContent = `${settings.days_until} day${settings.days_until === 1 ? '' : 's'}`;
        const d = new Date(settings.next_payday + 'T00:00:00');
        dateDisplay.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + (settings.expected_amount ? ` · ${formatPHP(settings.expected_amount)}` : '');
      } else {
        daysDisplay.textContent = '--';
        dateDisplay.textContent = 'Set your payday';
      }

      document.getElementById('paydayDayInput').value = settings.payday_day || '';
      document.getElementById('paydayAmountInput').value = settings.expected_amount || '';
    } catch (err) {
      console.warn('Could not load payday settings:', err.message);
    }
  }

  async function loadBills() {
    const session = await requireLogin();
    if (!session) return;
    const listContainer = document.getElementById('billsListContainer');
    const totalDueDisplay = document.getElementById('totalDueDisplay');
    const billCountDisplay = document.getElementById('billCountDisplay');

    try {
      const res = await fetch(`${API_BASE_URL}/recurring-bills/upcoming`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load bills');
      const bills = await res.json();

      const total = bills.reduce((sum, b) => sum + Number(b.amount), 0);
      totalDueDisplay.textContent = formatPHP(total);
      billCountDisplay.textContent = `${bills.length} bill${bills.length === 1 ? '' : 's'}`;

      listContainer.innerHTML = '';
      if (bills.length === 0) {
        listContainer.innerHTML = '<p class="text-center font-body-md text-body-md text-on-surface-variant py-8">No bills yet. Tap "Add Bill" to get started.</p>';
        return;
      }

      bills.forEach(bill => {
        const icon = CATEGORY_ICON_MAP[bill.category] || 'receipt';
        const isOverdue = bill.is_overdue;
        const daysLabel = isOverdue ? `${Math.abs(bill.days_left)}d overdue` : (bill.days_left === 0 ? 'Due today' : `${bill.days_left} days left`);
        const daysColor = isOverdue ? 'text-error' : (bill.days_left <= 3 ? 'text-error' : 'text-on-surface-variant');

        const row = document.createElement('div');
        row.className = 'bg-surface-container-lowest rounded-2xl p-4 border border-outline-variant/30 shadow-sm flex items-center gap-3';
        row.innerHTML = `
          <div class="w-11 h-11 rounded-full bg-secondary-container/40 text-secondary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">${icon}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="font-headline-sm text-headline-sm text-on-surface truncate">${bill.name}</span>
              <span class="font-label-lg text-label-lg font-bold text-on-surface shrink-0">${formatPHP(bill.amount)}</span>
            </div>
            <div class="flex items-center justify-between gap-2 mt-0.5">
              <span class="font-label-sm text-label-sm ${daysColor} font-semibold">${daysLabel} · Due ${bill.next_due_date}</span>
              <div class="flex items-center gap-1 shrink-0">
                <button class="mark-paid-btn text-secondary flex items-center justify-center rounded-full hover:bg-secondary-container/30 transition-colors p-1" data-id="${bill.id}" title="Mark as paid" type="button">
                  <span class="material-symbols-outlined text-[18px]">task_alt</span>
                </button>
                <button class="delete-bill-btn text-on-surface-variant flex items-center justify-center rounded-full hover:bg-surface-container transition-colors p-1" data-id="${bill.id}" data-name="${bill.name.replace(/"/g, '&quot;')}" title="Delete bill" type="button">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </div>
            </div>
          </div>
        `;
        listContainer.appendChild(row);
      });

      document.querySelectorAll('.mark-paid-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          try {
            const session2 = await requireLogin();
            if (!session2) return;
            const res = await fetch(`${API_BASE_URL}/recurring-bills/${id}/mark-paid`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${session2.access_token}` }
            });
            if (!res.ok) throw new Error('Could not mark bill as paid');
            showToast('Bill marked as paid');
            await loadBills();
          } catch (err) {
            showToast(err.message || 'Could not mark bill as paid');
          }
        });
      });

      document.querySelectorAll('.delete-bill-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const name = btn.getAttribute('data-name');
          if (!confirm(`Are you sure you want to delete "${name}"?`)) return;
          try {
            const session2 = await requireLogin();
            if (!session2) return;
            const res = await fetch(`${API_BASE_URL}/recurring-bills/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${session2.access_token}` }
            });
            if (!res.ok) throw new Error('Could not delete bill');
            showToast('Bill deleted');
            await loadBills();
          } catch (err) {
            showToast(err.message || 'Could not delete bill');
          }
        });
      });
    } catch (err) {
      console.warn('Could not load bills:', err.message);
      listContainer.innerHTML = '<p class="text-center font-body-md text-body-md text-on-surface-variant py-8">Could not load bills.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadPaydaySettings();
    loadBills();

    const addBillModal = document.getElementById('addBillModal');
    document.getElementById('openAddBillBtn').addEventListener('click', () => {
      addBillModal.classList.remove('hidden');
    });
    document.getElementById('closeAddBillModalBtn').addEventListener('click', () => {
      addBillModal.classList.add('hidden');
    });

    document.getElementById('saveNewBillBtn').addEventListener('click', async () => {
      const name = document.getElementById('newBillName').value.trim();
      const amount = parseFloat(document.getElementById('newBillAmount').value) || 0;
      const category = document.getElementById('newBillCategory').value;
      const payment_method = document.getElementById('newBillMethod').value;
      const due_day = parseInt(document.getElementById('newBillDueDay').value, 10);

      if (!name) { alert('Please enter a bill name.'); return; }
      if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }
      if (!due_day || due_day < 1 || due_day > 31) { alert('Please enter a due day between 1 and 31.'); return; }

      const session = await requireLogin();
      if (!session) return;

      try {
        const res = await fetch(`${API_BASE_URL}/recurring-bills`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ name, amount, category, due_day, payment_method })
        });
        if (!res.ok) throw new Error('Could not create bill');

        addBillModal.classList.add('hidden');
        document.getElementById('newBillName').value = '';
        document.getElementById('newBillAmount').value = '';
        document.getElementById('newBillDueDay').value = '';
        showToast('Bill added');
        await loadBills();
      } catch (err) {
        alert('Could not add bill: ' + err.message);
      }
    });

    const paydayModal = document.getElementById('paydayModal');
    document.getElementById('editPaydayBtn').addEventListener('click', () => {
      paydayModal.classList.remove('hidden');
    });
    document.getElementById('closePaydayModalBtn').addEventListener('click', () => {
      paydayModal.classList.add('hidden');
    });

    document.getElementById('savePaydayBtn').addEventListener('click', async () => {
      const payday_day = parseInt(document.getElementById('paydayDayInput').value, 10);
      const expected_amount = parseFloat(document.getElementById('paydayAmountInput').value) || 0;

      if (!payday_day || payday_day < 1 || payday_day > 31) { alert('Please enter a valid day between 1 and 31.'); return; }

      const session = await requireLogin();
      if (!session) return;

      try {
        const res = await fetch(`${API_BASE_URL}/payday-settings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ payday_day, expected_amount })
        });
        if (!res.ok) throw new Error('Could not save payday settings');

        paydayModal.classList.add('hidden');
        showToast('Payday settings saved');
        await loadPaydaySettings();
      } catch (err) {
        alert('Could not save payday settings: ' + err.message);
      }
    });
  });
})();
</script>

<!-- Toast Notification -->
<div class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] max-w-[90%] bg-inverse-surface text-inverse-on-surface rounded-full px-4 py-3 shadow-xl flex items-center gap-2" id="toastNotification">
<span class="material-symbols-outlined text-[18px]" id="toastIcon">check_circle</span>
<span class="font-label-md text-label-md font-medium" id="toastMessage"></span>
</div>

<script>
(function(){
  const API_BASE_URL = 'http://localhost:3000';

  const SUPABASE_URL = 'https://ieauwvbivmmgfkbbejtd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_d5JSuSnKziL9PxzqYwf2Bg_1b8ZyDmC';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function requireLogin() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'index.html';
    }
    return data.session;
  }

  function formatPHP(amount) {
    return '₱' + Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const toast = document.getElementById('toastNotification');
  const toastMessage = document.getElementById('toastMessage');
  const toastIcon = document.getElementById('toastIcon');
  let toastTimer = null;
  function showToast(msg, icon = 'check_circle') {
    if (toastTimer) clearTimeout(toastTimer);
    toastMessage.textContent = msg;
    toastIcon.textContent = icon;
    toast.classList.remove('hidden');
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 4000);
  }

  function addParticipantRow(name = '', amount = '') {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 participant-row';
    row.innerHTML = `
      <input class="flex-1 px-3 py-2 bg-surface-container-low rounded-lg border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-secondary participant-name" placeholder="Name" type="text" value="${name}"/>
      <input class="w-24 px-3 py-2 bg-surface-container-low rounded-lg border border-outline-variant/40 text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-secondary participant-amount" min="0" placeholder="0.00" step="0.01" type="number" value="${amount}"/>
      <button class="w-8 h-8 shrink-0 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors remove-participant-btn" type="button">
        <span class="material-symbols-outlined text-[16px]">close</span>
      </button>
    `;
    row.querySelector('.remove-participant-btn').addEventListener('click', () => row.remove());
    document.getElementById('participantRows').appendChild(row);
  }

  function renderSplitCard(bill) {
    const card = document.createElement('div');
    card.className = 'bg-surface-container-lowest rounded-2xl p-4 border border-outline-variant/30 shadow-sm flex flex-col gap-3';
    const participantsHtml = bill.participants.map(p => `
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="material-symbols-outlined text-[16px] ${p.paid ? 'text-secondary' : 'text-on-surface-variant'}">${p.paid ? 'check_circle' : 'radio_button_unchecked'}</span>
          <span class="font-body-md text-body-md text-on-surface truncate ${p.paid ? 'line-through text-on-surface-variant' : ''}">${p.name}</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="font-label-sm text-label-sm text-on-surface-variant">${formatPHP(p.share_amount)}</span>
          ${p.paid ? '' : `<button class="mark-paid-btn text-secondary font-label-sm text-label-sm font-bold px-2 py-1 rounded-full hover:bg-secondary-container/30 transition-colors" data-bill-id="${bill.id}" data-participant-id="${p.id}" type="button">Mark paid</button>`}
        </div>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0">
          <span class="font-headline-sm text-headline-sm text-on-surface truncate block">${bill.title}</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant">${bill.category} · ${formatPHP(bill.total_amount)} total</span>
        </div>
        <button class="delete-split-btn text-on-surface-variant flex items-center justify-center rounded-full hover:bg-surface-container transition-colors p-1 shrink-0" data-id="${bill.id}" data-title="${bill.title.replace(/"/g, '&quot;')}" title="Delete" type="button">
          <span class="material-symbols-outlined text-[18px]">delete</span>
        </button>
      </div>
      <div class="flex items-center justify-between">
        <span class="font-label-sm text-label-sm text-on-surface-variant">${bill.paid_count}/${bill.participant_count} paid</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">${formatPHP(bill.collected_amount)} collected</span>
      </div>
      <div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
        <div class="h-full bg-secondary rounded-full transition-all" style="width:${bill.percent_collected}%;"></div>
      </div>
      <div class="flex flex-col gap-1.5 pt-1 border-t border-outline-variant/20">
        ${participantsHtml}
      </div>
    `;
    return card;
  }

  async function loadSplitBills() {
    const session = await requireLogin();
    if (!session) return;
    try {
      const res = await fetch(`${API_BASE_URL}/split-bills`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!res.ok) throw new Error('Could not load split bills');
      const bills = await res.json();

      const container = document.getElementById('splitListContainer');
      container.innerHTML = '';

      if (bills.length === 0) {
        container.innerHTML = '<p class="text-center font-body-sm text-body-sm text-on-surface-variant py-8">No split bills yet. Tap "New" to split one with friends.</p>';
        return;
      }

      bills.forEach(b => container.appendChild(renderSplitCard(b)));

      document.querySelectorAll('.mark-paid-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const billId = btn.getAttribute('data-bill-id');
          const participantId = btn.getAttribute('data-participant-id');
          try {
            const session2 = await requireLogin();
            if (!session2) return;
            const res = await fetch(`${API_BASE_URL}/split-bills/${billId}/participants/${participantId}/mark-paid`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${session2.access_token}` }
            });
            if (!res.ok) throw new Error('Could not mark as paid');
            showToast('Marked as paid');
            await loadSplitBills();
          } catch (err) {
            showToast(err.message || 'Could not mark as paid');
          }
        });
      });

      document.querySelectorAll('.delete-split-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const title = btn.getAttribute('data-title');
          if (!confirm(`Are you sure you want to delete "${title}"?`)) return;
          try {
            const session2 = await requireLogin();
            if (!session2) return;
            const res = await fetch(`${API_BASE_URL}/split-bills/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${session2.access_token}` }
            });
            if (!res.ok) throw new Error('Could not delete bill');
            showToast('Deleted');
            await loadSplitBills();
          } catch (err) {
            showToast(err.message || 'Could not delete bill');
          }
        });
      });
    } catch (err) {
      console.warn('Could not load split bills:', err.message);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSplitBills();

    const modal = document.getElementById('newSplitModal');
    document.getElementById('newSplitBtn').addEventListener('click', () => {
      document.getElementById('newSplitTitle').value = '';
      document.getElementById('newSplitTotal').value = '';
      document.getElementById('participantRows').innerHTML = '';
      addParticipantRow();
      addParticipantRow();
      modal.classList.remove('hidden');
    });
    document.getElementById('closeNewSplitModalBtn').addEventListener('click', () => {
      modal.classList.add('hidden');
    });
    document.getElementById('addParticipantRowBtn').addEventListener('click', () => addParticipantRow());

    document.getElementById('saveNewSplitBtn').addEventListener('click', async () => {
      const title = document.getElementById('newSplitTitle').value.trim();
      const total_amount = parseFloat(document.getElementById('newSplitTotal').value) || 0;

      if (!title) { alert('Please enter a bill name.'); return; }
      if (!total_amount || total_amount <= 0) { alert('Please enter a valid total amount.'); return; }

      const rows = document.querySelectorAll('#participantRows .participant-row');
      const participants = [];
      rows.forEach(row => {
        const name = row.querySelector('.participant-name').value.trim();
        const share_amount = parseFloat(row.querySelector('.participant-amount').value) || 0;
        if (name && share_amount > 0) {
          participants.push({ name, share_amount });
        }
      });

      if (participants.length === 0) { alert('Add at least one person with a share amount.'); return; }

      const session = await requireLogin();
      if (!session) return;

      try {
        const res = await fetch(`${API_BASE_URL}/split-bills`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ title, category: 'Other', total_amount, participants })
        });
        if (!res.ok) throw new Error('Could not save split bill');

        modal.classList.add('hidden');
        showToast('Saved');
        await loadSplitBills();
      } catch (err) {
        alert('Could not save: ' + err.message);
      }
    });
  });
})();
</script>
<script>if ('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('service-worker.js').catch(() => {});});}</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head><link href="manifest.json" rel="manifest"/><meta content="#f9f9f7" name="theme-color"/><link href="assets/icons/apple-touch-icon.png" rel="apple-touch-icon"/><link href="assets/icons/favicon-32.png" rel="icon" type="image/png"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="default" name="apple-mobile-web-app-status-bar-style"/><meta content="Fondly" name="apple-mobile-web-app-title"/>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondly Premium — Unlocked</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f9f9f7;
    color: #1a1c1b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 4px 20px -2px rgba(15,23,42,0.08);
  }
  .icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #82f5c1;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #45464d; font-size: 14px; margin: 0 0 20px; }
  a.button {
    display: inline-block;
    background: #123524;
    color: #fff;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="statusIcon">⏳</div>
  <h1 id="statusTitle">Confirming your payment...</h1>
  <p id="statusMessage">Please wait a moment.</p>
  <a class="button" href="home.html">Back to Fondly</a>
</div>

<script>
  const API_BASE_URL = '';  // same-origin: works both locally and when deployed

  async function confirmPremium() {
    const params = new URLSearchParams(window.location.search);
    const sourceId = params.get('source_id');
    const titleEl = document.getElementById('statusTitle');
    const msgEl = document.getElementById('statusMessage');
    const iconEl = document.getElementById('statusIcon');

      if (!sourceId) {
      // No source_id means this wasn't a GCash redirect (likely QR Ph, which confirms via polling instead)
      iconEl.textContent = '🎉';
      titleEl.textContent = "You're Premium!";
      msgEl.textContent = 'All Fondly Premium features are now unlocked, forever.';
      return;
    }

    try {
      const res = await fetch(`${API_BASE_URL}/premium/gcash/confirm?source_id=${encodeURIComponent(sourceId)}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Could not confirm payment');

      iconEl.textContent = '🎉';
      titleEl.textContent = "You're Premium!";
      msgEl.textContent = 'All Fondly Premium features are now unlocked, forever.';
    } catch (err) {
      iconEl.textContent = '⚠️';
      titleEl.textContent = 'Could not confirm payment';
      msgEl.textContent = err.message;
    }
  }

  confirmPremium();
</script>
<script>if ('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('service-worker.js').catch(() => {});});}</script></body>
</html>

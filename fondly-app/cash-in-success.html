<!DOCTYPE html>
<html lang="en">
<head><link href="manifest.json" rel="manifest"/><meta content="#f9f9f7" name="theme-color"/><link href="assets/icons/apple-touch-icon.png" rel="apple-touch-icon"/><link href="assets/icons/favicon-32.png" rel="icon" type="image/png"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="default" name="apple-mobile-web-app-status-bar-style"/><meta content="Fondly" name="apple-mobile-web-app-title"/>
<meta charset="utf-8">
<title>Payment Successful</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f9f9f7; margin: 0; }
  .card { background: white; padding: 2rem; border-radius: 16px; text-align: center; max-width: 320px; }
  h1 { color: #006c4a; }
  a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #123524; color: white; border-radius: 999px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>✓ Payment Received</h1>
  <p id="statusText">Confirming your payment...</p>
  <a href="home.html">Go to Home</a>
</div>
<script>
  (async function() {
    const params = new URLSearchParams(window.location.search);
    const sourceId = params.get('source_id');
    const statusText = document.getElementById('statusText');
    if (!sourceId) {
      statusText.textContent = 'Missing payment reference.';
      return;
    }
    try {
      const res = await fetch(`http://localhost:3000/gcash/confirm?source_id=${sourceId}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not confirm payment');
      statusText.textContent = `₱${Number(data.amount).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} added to your account.`;
    } catch (err) {
      statusText.textContent = 'Could not confirm: ' + err.message;
    }
  })();
</script>
<script>if ('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('service-worker.js').catch(() => {});});}</script></body>
</html>
